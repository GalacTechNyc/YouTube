<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="description" content="Watch YouTube on your Meta Ray-Ban Display glasses">
  <meta name="theme-color" content="#000000">
  <title>YouTube</title>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.google.com">
  <link rel="dns-prefetch" href="https://googlevideo.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="home" class="home">
    <header>
      <span class="brand"><span class="mark">▶</span> YouTube</span>
      <span id="status" class="status"></span>
    </header>

    <div class="top">
      <textarea id="search" class="focusable" rows="1" placeholder="Search…" aria-label="Search YouTube"></textarea>
      <button id="tabForYou" class="focusable tab" data-tab="foryou"><span class="ico">✨</span><span class="lbl">For you</span></button>
      <button id="tabHot" class="focusable tab" data-tab="hot"><span class="ico">🔥</span><span class="lbl">Hot</span></button>
      <button id="tabSubs" class="focusable tab" data-tab="subs"><span class="ico">📺</span><span class="lbl">Subs</span></button>
      <button id="tabLibrary" class="focusable tab" data-tab="library"><span class="ico">📚</span><span class="lbl">Library</span></button>
    </div>

    <p id="listTitle" class="list-title"></p>
    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden></p>
    <div id="signin" class="signin" hidden>
      <p class="s1">On your phone, go to</p>
      <p id="signinUrl" class="s2">google.com/device</p>
      <p class="s1">and enter this code:</p>
      <p id="signinCode" class="code"></p>
      <p id="signinNote" class="s3">Waiting for you to approve… · back to cancel</p>
    </div>
  </div>

  <div id="player" class="player" tabindex="-1" hidden>
    <div class="frame"><div id="ytPlayer"></div></div>
    <div class="info">
      <p id="title" class="title"></p>
      <div class="bar"><div id="progress" class="progress"></div></div>
      <p id="meta" class="meta"></p>
      <p class="hint">Pinch play/pause · ← → 10s · ↑ ↓ volume · back closes</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
